<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1b1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="No Kapu Tuner">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>No Kapu Tuner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* ---------- Themes. Night = the dark reference UI. Tuna = an ahi palette (ruby, deep ocean, sea salt, limu green, yellowfin gold). ---------- */
  :root { --state: var(--idle); }
  [data-theme="night"] {
    --bg: #1b1b1b; --bg2: #1b1b1b; --panel: #2e2e2e; --panel-line: #3b3b3b;
    --text: #e6e6e6; --dim: #a8a8a8; --track: #3b3b3b; --stage: transparent;
    --off: #ffb020; --on: #69cd7f; --idle: #6b6b6b; --accent: #ffb020;
    --primary-bg: #e6e6e6; --primary-text: #1b1b1b;
    --leaf-opacity: 0.07; --leafvein: #1b1b1b;
  }
  [data-theme="tuna"] {
    /* Ahi palette: deep ocean back, ruby flesh, sea-salt white, limu green, a touch of yellowfin gold */
    --bg: #0a2230; --bg2: #0d2b3d; --panel: #123246; --panel-line: #21495f;
    --text: #eef3f2; --dim: #93b2bf; --track: #24495c; --stage: transparent;
    --off: #ff6b61; --on: #6fe0bd; --idle: #5d8294; --accent: #f2c14e;
    --primary-bg: #c8283f; --primary-text: #ffffff;
    --leaf-opacity: 0.09; --leafvein: #0a2230;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overscroll-behavior: none;
    background: var(--bg); color: var(--text);
    font-family: "Noto Sans", "Open Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  body { display: flex; justify-content: center; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }

  .app {
    position: relative; width: 100%; max-width: 560px; height: 100%; height: 100dvh; overflow: hidden;
    background: linear-gradient(180deg, var(--bg), var(--bg2));
  }
  .app[data-state="off"]  { --state: var(--off); }
  .app[data-state="on"]   { --state: var(--on); }
  .app[data-state="idle"] { --state: var(--idle); }

  .view {
    position: absolute; inset: 0; display: none; flex-direction: column;
    padding: max(14px, env(safe-area-inset-top)) 18px max(14px, env(safe-area-inset-bottom));
  }
  .app[data-view="home"] #viewHome,
  .app[data-view="tuner"] #viewTuner,
  .app[data-view="settings"] #viewSettings { display: flex; }

  .icon-btn { width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; background: transparent;
              display: flex; align-items: center; justify-content: center; }
  .ghost { min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--panel-line);
           background: transparent; font-size: 15px; font-weight: 600; }
  .fine { margin: 0; font-size: 13px; color: var(--dim); }

  /* ---------- Opening screen ---------- */
  .home { align-items: center; justify-content: center; text-align: center; }
  .home > .content { position: relative; z-index: 1; width: 100%; display: flex; flex-direction: column; align-items: center; }
  .brand { margin: 0; font-size: 34px; font-weight: 300; letter-spacing: -0.01em; }
  .brand .b1 { font-weight: 700; }
  .rule { display: block; width: 28px; height: 2px; margin: 16px auto 14px; border-radius: 2px; background: var(--accent); }
  .tag { margin: 0 0 44px; font-size: 12px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); }
    .primary { width: 100%; max-width: 340px; min-height: 58px; border: 0; border-radius: 12px;
             background: var(--primary-bg); color: var(--primary-text); font-size: 18px; font-weight: 600; letter-spacing: 0.04em; }
  .home .fine { margin-top: 12px; }
  .home .ghost { margin-top: 22px; }
  .msg { display: none; margin-top: 16px; max-width: 340px; padding: 10px 12px; border-radius: 10px; text-align: left;
         background: var(--panel); border: 1px solid var(--off); color: var(--text); font-size: 14px; line-height: 1.5; white-space: pre-line;
         -webkit-user-select: text; user-select: text; }
  .msg.show { display: block; }
  .leaf { position: absolute; pointer-events: none; color: var(--text); opacity: var(--leaf-opacity); }
  .leaf-a { width: 300px; height: 300px; right: -90px; top: -60px; transform: rotate(25deg); }
  .leaf-b { width: 340px; height: 340px; left: -130px; bottom: -90px; transform: rotate(-155deg); }
  .leaf-c { width: 180px; height: 180px; right: -36px; top: -22px; transform: rotate(20deg); }

  /* ---------- Tuner screen ---------- */
  .bar { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; }
  .bar h1 { margin: 0; text-align: center; font-size: 20px; font-weight: 600; letter-spacing: 0.01em; }
  .selectors { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  .sel { min-height: 56px; border-radius: 8px; border: 1px solid var(--panel-line); background: transparent;
         font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .strings { display: flex; gap: 8px; margin-top: 14px; justify-content: center; }
  .strings[hidden] { display: none; }
  .chip { position: relative; flex: 1; max-width: 64px; min-height: 48px; padding: 0; border-radius: 10px;
          border: 1px solid var(--panel-line); background: var(--panel); font-size: 18px; font-weight: 700; }
  .chip small { font-size: 0.6em; opacity: 0.7; }
  .chip.target { border: 2px solid var(--state); }
  .chip.locked::after { content: ""; position: absolute; bottom: 5px; left: 50%; width: 14px; height: 3px;
                        margin-left: -7px; border-radius: 2px; background: var(--text); }
  .hint { min-height: 18px; margin-top: 8px; text-align: center; font-size: 12px; color: var(--dim); }

  .main { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
  .stage { position: relative; width: 100%; max-width: 460px; margin: 0 auto; border-radius: 24px;
           background: var(--stage); padding: 18px 14px 40px; }
  .gauge { display: block; width: 100%; height: auto; overflow: visible; }
  .track { fill: none; stroke: var(--track); stroke-width: 5; stroke-linecap: round; }
  .zone { fill: none; stroke: var(--on); stroke-width: 6; opacity: 0.55; }
  .pointer { fill: var(--state); transition: fill 0.15s; }
  .needle { transform-origin: 180px 190px; transition: transform 0.12s linear, opacity 0.15s; }
  .needle rect { fill: var(--state); transition: fill 0.15s; }
  .app[data-state="idle"] .needle { opacity: 0; }
  .note { position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%);
          display: flex; align-items: flex-start; color: var(--state); font-weight: 400; line-height: 0.85;
          font-size: min(36vw, 150px); }
  .acc { display: flex; flex-direction: column; justify-content: space-between; height: 0.8em; min-width: 0.3em;
         margin-left: 0.05em; font-size: 0.26em; line-height: 1; }
  .status { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 14px;
            font-weight: 800; letter-spacing: 0.14em; color: var(--state); }
  .readout { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; max-width: 460px;
             margin: 0 auto; padding: 0 10px; font-size: 20px; font-variant-numeric: tabular-nums; }
  .readout .unit { color: var(--dim); }
  .readout b { font-weight: 600; }
  .tgt { display: block; font-size: 12px; color: var(--dim); }
  .readout .r { text-align: right; }

  /* ---------- Settings ---------- */
  .settings { overflow: hidden; }
  .settings .bar { position: relative; z-index: 1; }
  .body { position: relative; z-index: 1; flex: 1; overflow-y: auto; padding-top: 6px; }
  .body h2 { margin: 22px 0 10px; font-size: 13px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
  .themes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .theme-card { padding: 12px; border-radius: 12px; border: 2px solid var(--panel-line); background: var(--panel);
                text-align: left; font-size: 16px; font-weight: 700; }
  .theme-card[aria-pressed="true"] { border-color: var(--text); }
  .swatches { display: flex; gap: 6px; margin-bottom: 10px; }
  .swatches i { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(128,128,128,0.45); display: block; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px;
         padding: 0 14px; border-radius: 12px; border: 1px solid var(--panel-line); background: var(--panel);
         font-size: 17px; font-weight: 600; }
  .stepper { display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
  .stepper button { width: 44px; height: 44px; padding: 0; border-radius: 10px; border: 1px solid var(--panel-line);
                    background: transparent; font-size: 22px; }
  .switch { position: relative; width: 56px; height: 32px; padding: 0; border-radius: 16px; border: 0; background: var(--track); }
  .switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%;
                   background: var(--text); transition: transform 0.15s; }
  .switch[aria-checked="true"] { background: var(--on); }
  .switch[aria-checked="true"]::after { transform: translateX(24px); background: #fff; }
  .body .fine { margin-top: 14px; }

  /* ---------- Picker sheet ---------- */
  .backdrop { position: absolute; inset: 0; z-index: 10; display: flex; align-items: flex-end; background: rgba(0,0,0,0.45); }
  .backdrop[hidden] { display: none; }
  .sheet { width: 100%; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); border-radius: 20px 20px 0 0;
           background: var(--panel); color: var(--text); }
  .sheet h2 { margin: 0 0 6px; font-size: 14px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
  .opt { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 56px; padding: 0 4px;
         border: 0; border-bottom: 1px solid var(--panel-line); background: transparent; font-size: 19px; font-weight: 600; text-align: left; }
  .sheet .ghost { width: 100%; margin-top: 12px; }

  @media (prefers-reduced-motion: reduce) { .needle, .switch::after { transition: none; } }
</style>
</head>
<body data-theme="night">

<!-- Shared artwork: original vector motifs (monstera leaf). Used on the opening and settings screens only. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="monstera" viewBox="0 0 200 200">
      <path d="M100 8 C136 10 166 28 180 52 L142 60 L190 74 C196 92 196 108 190 124 L146 116 L184 138 C176 160 150 178 118 184 L100 160 L82 184 C50 178 24 160 16 138 L54 116 L10 124 C4 108 4 92 10 74 L58 60 L20 52 C34 28 64 10 100 8 Z" fill="currentColor"/>
      <path d="M100 160 V26 M100 122 L62 100 M100 122 L138 100 M100 86 L68 68 M100 86 L132 68" fill="none" stroke="var(--leafvein)" stroke-width="3" stroke-linecap="round"/>

<div class="app" id="app" data-state="idle" data-view="home">

  <!-- ===== Opening screen ===== -->
  <section class="view home" id="viewHome" aria-label="Welcome">
    <svg class="leaf leaf-a" viewBox="0 0 200 200" aria-hidden="true"><use href="#monstera" width="200" height="200"/></svg>
    <svg class="leaf leaf-b" viewBox="0 0 200 200" aria-hidden="true"><use href="#monstera" width="200" height="200"/></svg>
    <div class="content">

    <div class="selectors">
      <button class="sel" id="instBtn" type="button" aria-haspopup="dialog"><span id="instLabel">Guitar</span>

      <button class="sel" id="tuningBtn" type="button" aria-haspopup="dialog"><span id="tuningLabel">Standard</span>

    <div class="main">

          <path class="track" d="M30 190 A150 150 0 0 1 330 190"/>

  <!-- ===== Settings screen ===== -->

      </button>
      <h1>Settings</h1>
      <span></span>

        <div class="body">
      <h2>Theme</h2>
      <div class="themes">
        <button class="theme-card" type="button" data-theme-pick="night" aria-pressed="true">
          <span class="swatches" aria-hidden="true"><i style="background:#1b1b1b"></i><i style="background:#ffb020"></i><i style="background:#69cd7f"></i></span>Night</button>
        <button class="theme-card" type="button" data-theme-pick="tuna" aria-pressed="false">
          <span class="swatches" aria-hidden="true"><i style="background:#0a2230"></i><i style="background:#c8283f"></i><i style="background:#6fe0bd"></i><i style="background:#f2c14e"></i></span>Tuna</button>
      </div>
      <h2>Reference pitch</h2>

          <button type="button" id="refDown" aria-label="Lower reference pitch">−</button>
          <span id="refVal">A4 = 440 Hz</span>
          <button type="button" id="refUp" aria-label="Raise reference pitch">+</button>
        </div>
      </div>
      <h2>Sound</h2>

  <!-- ===== Picker sheet ===== -->

<script>
'use strict';

/* =====================================================================
   TUNABLE CONSTANTS  (the one you asked for is first)
   ===================================================================== */
const IN_TUNE_CENTS   = 5;     // within ± this many cents counts as "in tune"
const REARM_CENTS     = 15;    // chime can't fire again until you drift beyond ± this
const HOLD_MS         = 600;   // must stay in tune this long before the chime
const CHIME_PAUSE_MS  = 400;   // detection is paused this long while the chime plays
const MIN_RMS         = 0.01;  // volume gate (0..1). Raise if room noise triggers readings.
const REF_MIN = 430, REF_MAX = 450, REF_DEFAULT = 440;   // A4 reference pitch range (Hz)

const FFT_SIZE        = 4096;  // analysis buffer length (samples)
const FRAME_MS        = 30;    // minimum time between detections
const MEDIAN_FRAMES   = 5;     // smoothing window (median of last N readings)
const YIN_THRESHOLD   = 0.15;  // YIN absolute threshold (lower = stricter)
const YIN_FALLBACK    = 0.25;  // weakest dip accepted when nothing beats the threshold
const SILENCE_HOLD_MS = 800;   // keep last reading on screen this long after sound stops
const REARM_SILENCE_MS= 600;   // silence this long counts as "stopped playing" (re-arms chime)
const GAP_GRACE_MS    = 250;   // brief dropouts shorter than this don't reset the hold timer
const METER_RANGE_CENTS = 50;  // gauge spans ± this many cents (half circle = ±50)
const CHROMATIC_MIN_HZ = 60, CHROMATIC_MAX_HZ = 2200;   // roughly C2 .. C7
const STRING_RANGE_LOW = 0.8, STRING_RANGE_HIGH = 1.5;  // search band around string pitches
const OCTAVE_NEAR_CENTS = 150; // "close to a string" for octave-error correction

/* =====================================================================
   TUNING DEFINITIONS — add instruments or tunings here. Note names only (e.g. 'E2').
   Frequencies are computed from the reference pitch, so the A4 setting scales all.
   strings: null = chromatic (no fixed strings).
   ===================================================================== */
const INSTRUMENTS = {
  chromatic: { label: 'Chromatic', tunings: {
    auto: { label: 'Auto', strings: null },
  } },
  guitar: { label: 'Guitar', tunings: {
    standard: { label: 'Standard', strings: ['E2', 'A2', 'D3', 'G3', 'B3', 'E4'] },
  } },
  ukulele: { label: 'Ukulele', tunings: {
    standard: { label: 'Standard', strings: ['G4', 'C4', 'E4', 'A4'] },   // re-entrant: G is the high G4
    lowG:     { label: 'Low G',    strings: ['G3', 'C4', 'E4', 'A4'] },   // G dropped an octave to G3
  } },
};

// ===== PURE LOGIC START (no DOM; unit-tested in Node) =====

/* ---------- Note / frequency math ---------- */
const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

// 'E2' -> MIDI number 40 (A4 = 69)
function parseNote(name) {
  const m = /^([A-G])([#b]?)(-?\d+)$/.exec(name);
  if (!m) throw new Error('Bad note name: ' + name);
  const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]];
  const acc = m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0;
  return 12 * (parseInt(m[3], 10) + 1) + base + acc;
}
function midiToFreq(midi, refA4) { return refA4 * Math.pow(2, (midi - 69) / 12); }
function freqToMidiFloat(f, refA4) { return 69 + 12 * Math.log2(f / refA4); }
function midiToName(midi) {
  const n = NOTE_NAMES[((midi % 12) + 12) % 12];
  return { letter: n[0], sharp: n.length > 1, octave: Math.floor(midi / 12) - 1 };
}
// Cents the detected pitch is above (+) or below (-) the target.
function centsBetween(f, target) { return 1200 * Math.log2(f / target); }
function nearestCents(f, list) {
  let best = Infinity;
  for (const t of list) best = Math.min(best, Math.abs(centsBetween(f, t)));
  return best;
}

/* ---------- Small helpers ---------- */
function median(arr) {
  const s = arr.slice().sort((a, b) => a - b);
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
function rms(buf) {
  let s = 0;
  for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
  return Math.sqrt(s / buf.length);
}

/* ---------- Pitch detection: YIN ----------
   buf: Float32 time-domain samples. Returns { freq, clarity } or null.
   preferHz: optional list of expected pitches (string modes) used only to
   correct "locked onto the 2nd harmonic" octave errors. */
function yin(buf, sampleRate, minHz, maxHz, preferHz) {
  const N = buf.length;
  const tauMax = Math.min(Math.floor(sampleRate / minHz), N >> 1);
  const tauMin = Math.max(2, Math.floor(sampleRate / maxHz));
  const W = Math.min(2048, N - tauMax - 2);
  if (W < 256 || tauMax <= tauMin + 2) return null;

  // Steps 1-3: difference function -> cumulative mean normalised difference
  const cm = new Float32Array(tauMax + 2);
  cm[0] = 1;
  let run = 0;
  for (let tau = 1; tau <= tauMax + 1; tau++) {
    let sum = 0;
    for (let j = 0; j < W; j++) { const d = buf[j] - buf[j + tau]; sum += d * d; }
    run += sum;
    cm[tau] = run > 0 ? (sum * tau) / run : 1;
  }

  // Step 4: first dip below threshold, then walk down to its local minimum
  let tau = -1;
  for (let t = tauMin; t <= tauMax; t++) {
    if (cm[t] < YIN_THRESHOLD) {
      while (t + 1 <= tauMax && cm[t + 1] < cm[t]) t++;
      tau = t;
      break;
    }
  }
  if (tau < 0) { // fallback: best local minimum if it is reasonably clear
    let best = tauMin;
    for (let t = tauMin; t <= tauMax; t++) if (cm[t] < cm[best]) best = t;
    const isMin = best > 1 && cm[best] <= cm[best - 1] && cm[best] <= cm[best + 1];
    if (!isMin || cm[best] > YIN_FALLBACK) return null;
    tau = best;
  }

  // Octave-error guard (string modes only): if the detected pitch is NOT near
  // any string but half of it IS, and the signal is periodic at that lower
  // pitch too, we latched onto a harmonic -> use the lower octave.
  if (preferHz && preferHz.length && nearestCents(sampleRate / tau, preferHz) > OCTAVE_NEAR_CENTS) {
    const t2 = tau * 2;
    const lo = Math.max(tauMin, Math.round(t2 * 0.97));
    const hi = Math.min(tauMax, Math.round(t2 * 1.03));
    if (hi > lo) {
      let b = lo;
      for (let t = lo; t <= hi; t++) if (cm[t] < cm[b]) b = t;
      if (cm[b] < YIN_FALLBACK && nearestCents(sampleRate / b, preferHz) <= OCTAVE_NEAR_CENTS) tau = b;
    }
  }

  // Step 5: parabolic interpolation for sub-sample accuracy
  let refined = tau;
  if (tau >= 2 && tau <= tauMax) {
    const s0 = cm[tau - 1], s1 = cm[tau], s2 = cm[tau + 1];
    const den = 2 * (2 * s1 - s2 - s0);
    if (den !== 0) { const shift = (s2 - s0) / den; if (Math.abs(shift) <= 1) refined += shift; }
  }
  return { freq: sampleRate / refined, clarity: 1 - cm[tau] };
}

/* ---------- Detector setup for an instrument + tuning ---------- */
function getTuning(instKey, tuningKey) {
  const inst = INSTRUMENTS[instKey];
  return inst.tunings[tuningKey] || inst.tunings[Object.keys(inst.tunings)[0]];
}
function buildDetector(instKey, tuningKey, refA4) {
  const t = getTuning(instKey, tuningKey);
  if (!t.strings) {
    return { strings: null, ref: refA4, minHz: CHROMATIC_MIN_HZ, maxHz: CHROMATIC_MAX_HZ, preferHz: null };
  }
  const midis = t.strings.map(parseNote);
  const targetHz = midis.map(m => midiToFreq(m, refA4));
  return {
    strings: t.strings, midis, targetHz, ref: refA4,
    minHz: Math.min(...targetHz) * STRING_RANGE_LOW,
    maxHz: Math.max(...targetHz) * STRING_RANGE_HIGH,
    preferHz: targetHz,
  };
}

/* ---------- Turn a frequency into a reading ---------- */
function pickTarget(freq, targetHz, lockedIndex) {
  if (lockedIndex != null) return lockedIndex;
  let best = 0, bestC = Infinity;
  for (let i = 0; i < targetHz.length; i++) {
    const c = Math.abs(centsBetween(freq, targetHz[i]));
    if (c < bestC) { bestC = c; best = i; }
  }
  return best;
}
function evaluate(freq, det, lockedIndex) {
  let midi, idx = -1, targetHz;
  if (!det.strings) {
    midi = Math.max(0, Math.min(127, Math.round(freqToMidiFloat(freq, det.ref))));
    targetHz = midiToFreq(midi, det.ref);
  } else {
    idx = pickTarget(freq, det.targetHz, lockedIndex);
    midi = det.midis[idx];
    targetHz = det.targetHz[idx];
  }
  return Object.assign(
    { freq, targetHz, cents: centsBetween(freq, targetHz), index: idx, key: det.strings ? 's' + idx : 'm' + midi },
    midiToName(midi)
  );
}

/* ---------- Chime gate: hold + once-per-success + hysteresis ----------
   update(nowMs, centsOrNull, targetKey) -> true exactly when the chime should play.
   cents is null when there is no usable signal. */
function createChimeGate() {
  let inSince = null, armed = true, lastKey = null, lastSignal = null;
  return {
    update(now, cents, key) {
      if (cents === null) {
        if (lastSignal !== null) {
          const gap = now - lastSignal;
          if (gap > GAP_GRACE_MS) inSince = null;       // real dropout: restart the hold timer
          if (gap > REARM_SILENCE_MS) armed = true;     // you stopped playing: next success may chime
        }
        return false;
      }
      lastSignal = now;
      if (key !== lastKey) { lastKey = key; inSince = null; armed = true; }  // new string/note
      const off = Math.abs(cents);
      if (off <= IN_TUNE_CENTS) {
        if (inSince === null) inSince = now;
        if (armed && now - inSince >= HOLD_MS) { armed = false; return true; }
      } else {
        inSince = null;
        if (off > REARM_CENTS) armed = true;            // drifted far enough: allow another chime
      }
      return false;
    },
  };
}
// ===== PURE LOGIC END =====

/* =====================================================================
   APP (DOM + audio). Everything below needs a browser.
   ===================================================================== */
const $ = id => document.getElementById(id);
const el = {
  app: $('app'), title: $('title'),
  start: $('startBtn'), msg: $('msg'), homeSettings: $('homeSettings'),
  stop: $('stopBtn'), gear: $('gearBtn'),
  instBtn: $('instBtn'), instLabel: $('instLabel'), tuningBtn: $('tuningBtn'), tuningLabel: $('tuningLabel'),
  strings: $('strings'), hint: $('hint'),
  letter: $('nLetter'), sharp: $('nSharp'), oct: $('nOct'), status: $('status'),
  needle: $('needle'), zone: $('zone'), hz: $('hz'), tgt: $('tgt'), cents: $('cents'),
  settingsBack: $('settingsBack'), refVal: $('refVal'), refDown: $('refDown'), refUp: $('refUp'),
  chime: $('chimeSwitch'), tolNote: $('tolNote'),
  sheet: $('sheet'), sheetTitle: $('sheetTitle'), sheetList: $('sheetList'), sheetCancel: $('sheetCancel'),
};

function load(key, fallback) { try { const v = localStorage.getItem('no-kapu.' + key); return v === null ? fallback : v; } catch (e) { return fallback; } }
function save(key, val) { try { localStorage.setItem('no-kapu.' + key, String(val)); } catch (e) {} }

const savedInst = load('inst', 'guitar');
const startInst = INSTRUMENTS[savedInst] ? savedInst : 'guitar';
const savedTuning = load('tuning', '');
const state = {
  inst: startInst,
  tuning: INSTRUMENTS[startInst].tunings[savedTuning] ? savedTuning : Object.keys(INSTRUMENTS[startInst].tunings)[0],
  lockedIndex: null,
  ref: Math.min(REF_MAX, Math.max(REF_MIN, parseInt(load('ref', REF_DEFAULT), 10) || REF_DEFAULT)),
  muted: load('muted', 'false') === 'true',
  theme: load('theme', 'night') === 'tuna' ? 'tuna' : 'night',
  running: false,
  view: 'home', prevView: 'home',
};
let det = buildDetector(state.inst, state.tuning, state.ref);

// audio runtime
let audioCtx = null, stream = null, source = null, analyser = null, buf = null;
let rafId = 0, wakeLock = null;
let lastFrameAt = 0, lastSignalAt = -Infinity, pausedUntil = 0;
let history = [], lastReading = null;
let gate = createChimeGate();

/* ---------- Views, theme ---------- */
function setView(v) {
  if (v === 'settings') state.prevView = state.view;
  state.view = v;
  el.app.dataset.view = v;
  if (v === 'tuner') resetReading();
}
function applyTheme(name) {
  state.theme = name;
  save('theme', name);
  document.body.dataset.theme = name;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', name === 'tuna' ? '#0a2230' : '#1b1b1b');
  document.querySelectorAll('[data-word]').forEach(n => { n.textContent = word(); });
  document.title = 'No Kapu ' + word();
  updateSelectors();
  document.querySelectorAll('[data-theme-pick]').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.themePick === name)));
}

/* ---------- Instrument / tuning selection ---------- */
function currentStrings() { return getTuning(state.inst, state.tuning).strings; }
function rebuildDetector() { det = buildDetector(state.inst, state.tuning, state.ref); }
// The name of the thing changes with the palette: Night says Tuner, Tuna says Tuna.
function word() { return state.theme === 'tuna' ? 'Tuna' : 'Tuner'; }
function updateSelectors() {
  el.title.textContent = INSTRUMENTS[state.inst].label + ' ' + word();
  el.instLabel.textContent = INSTRUMENTS[state.inst].label;
  el.tuningLabel.textContent = getTuning(state.inst, state.tuning).label;
}
function setInstrument(key) {
  state.inst = key;
  state.tuning = Object.keys(INSTRUMENTS[key].tunings)[0];
  state.lockedIndex = null;
  save('inst', key); save('tuning', state.tuning);
  rebuildDetector(); updateSelectors(); buildStrings(); updateHint(); resetReading();
}
function setTuning(key) {
  state.tuning = key;
  state.lockedIndex = null;
  save('tuning', key);
  rebuildDetector(); updateSelectors(); buildStrings(); updateHint(); resetReading();
}

/* ---------- String chips ---------- */
function buildStrings() {
  el.strings.innerHTML = '';
  const names = currentStrings();
  el.strings.hidden = !names;
  if (!names) return;
  names.forEach((name, i) => {
    const m = /^([A-G])([#b]?)(-?\d+)$/.exec(name);
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button';
    b.innerHTML = m[1] + (m[2] ? (m[2] === '#' ? '♯' : '♭') : '') + '<small>' + m[3] + '</small>';
    b.setAttribute('aria-label', 'String ' + name);
    b.addEventListener('click', () => {
      state.lockedIndex = state.lockedIndex === i ? null : i;   // tap again = back to auto
      resetReading(); updateHint();
    });
    el.strings.appendChild(b);
  });
  markStrings(null);
}
function markStrings(activeIdx) {
  const kids = el.strings.children;
  for (let i = 0; i < kids.length; i++) {
    const locked = state.lockedIndex === i;
    kids[i].classList.toggle('locked', locked);
    kids[i].classList.toggle('target', locked || activeIdx === i);
    kids[i].setAttribute('aria-pressed', String(locked));
  }
}
function updateHint() {
  const names = currentStrings();
  if (!names) { el.hint.textContent = ''; return; }
  el.hint.textContent = state.lockedIndex === null
    ? 'Auto-detect · tap a string to lock it'
    : 'Locked to ' + names[state.lockedIndex] + ' · tap it again for auto';
}

/* ---------- Picker sheet ---------- */
let sheetTrigger = null;
function openSheet(kind, trigger) {
  sheetTrigger = trigger;
  el.sheetTitle.textContent = kind === 'inst' ? 'Instrument' : 'Tuning';
  el.sheetList.innerHTML = '';
  const entries = kind === 'inst'
    ? Object.keys(INSTRUMENTS).map(k => [k, INSTRUMENTS[k].label, k === state.inst])
    : Object.keys(INSTRUMENTS[state.inst].tunings).map(k => [k, INSTRUMENTS[state.inst].tunings[k].label, k === state.tuning]);
  entries.forEach(([key, label, selected]) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.type = 'button';
    b.setAttribute('aria-pressed', String(selected));
    const span = document.createElement('span'); span.textContent = label; b.appendChild(span);
    if (selected) b.insertAdjacentHTML('beforeend', '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>');
    b.addEventListener('click', () => { closeSheet(); if (kind === 'inst') setInstrument(key); else setTuning(key); });
    el.sheetList.appendChild(b);
  });
  el.sheet.hidden = false;
  (el.sheetList.querySelector('[aria-pressed="true"]') || el.sheetList.firstChild).focus();
}
function closeSheet() {
  el.sheet.hidden = true;
  if (sheetTrigger) sheetTrigger.focus();
}

/* ---------- Settings controls ---------- */
function setRef(v) {
  state.ref = Math.min(REF_MAX, Math.max(REF_MIN, v));
  save('ref', state.ref);
  el.refVal.textContent = 'A4 = ' + state.ref + ' Hz';
  rebuildDetector(); resetReading();
}
function setMuted(m) {
  state.muted = m;
  save('muted', m);
  el.chime.setAttribute('aria-checked', String(!m));
}
function resetReading() {
  history = []; lastReading = null; lastSignalAt = -Infinity;
  gate = createChimeGate();
  render(null);
}

/* ---------- Rendering ---------- */
const DEG_PER_CENT = 90 / METER_RANGE_CENTS;       // half circle spans ±METER_RANGE_CENTS
function render(r) {
  if (!r) {
    el.app.dataset.state = 'idle';
    el.letter.textContent = '–'; el.sharp.textContent = ''; el.oct.textContent = '';
    el.status.textContent = state.running ? 'PLAY A NOTE' : '';
    el.needle.style.transform = 'rotate(0deg)';
    el.hz.textContent = '—'; el.tgt.textContent = 'target —'; el.cents.textContent = '—';
    markStrings(null);
    return;
  }
  const c = Math.round(r.cents);               // state is judged on the number you see
  const inTune = Math.abs(c) <= IN_TUNE_CENTS;
  el.app.dataset.state = inTune ? 'on' : 'off';
  el.letter.textContent = r.letter;
  el.sharp.textContent = r.sharp ? '♯' : '';
  el.oct.textContent = r.octave;
  el.status.textContent = inTune ? 'IN TUNE' : (c < 0 ? 'FLAT' : 'SHARP');
  const clamped = Math.max(-METER_RANGE_CENTS, Math.min(METER_RANGE_CENTS, r.cents));
  el.needle.style.transform = 'rotate(' + (clamped * DEG_PER_CENT).toFixed(1) + 'deg)';
  el.hz.textContent = Math.round(r.freq);
  el.tgt.textContent = 'target ' + r.targetHz.toFixed(1);
  el.cents.textContent = (c > 0 ? '+' : c < 0 ? '−' : '') + Math.abs(c);
  markStrings(r.index >= 0 ? r.index : null);
}
/* ---------- Microphone help ----------
   A web page cannot switch the microphone on by itself, and it cannot open the Settings app.
   The system asks ONCE, when you tap Start tuning. If it was ever answered "Don't Allow", the only
   fix is to reset it, so say exactly where, for the device you are on. */
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_ANDROID = /Android/.test(navigator.userAgent);
function deniedHelp() {
  if (IS_IOS) return 'The microphone is turned off for No Kapu.\n\nFix it in the iPhone Settings app:\n1. Settings, then Apps, then Safari.\n2. Tap Microphone.\n3. Choose Ask or Allow (not Deny).\n4. Close this app completely, reopen it, and tap Start tuning.\n5. When iPhone asks, tap Allow.';
  if (IS_ANDROID) return 'The microphone is turned off for No Kapu.\n\nOpen Settings, then Apps, then this app or Chrome, then Permissions, then Microphone, and choose Allow. Come back and tap Start tuning.';
  return 'The microphone is blocked for this site.\n\nClick the lock icon beside the address bar, set Microphone to Allow, reload the page, and tap Start tuning.';
}
function showMsg(text) { el.msg.textContent = text; el.msg.classList.add('show'); }
function clearMsg() { el.msg.textContent = ''; el.msg.classList.remove('show'); }

/* ---------- Chime (two soft sine notes, no audio files) ---------- */
function playChime() {
  const t0 = audioCtx.currentTime + 0.01;
  [[880, 0], [1174.66, 0.13]].forEach(([f, dt]) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0 + dt);
    g.gain.exponentialRampToValueAtTime(0.35, t0 + dt + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.17);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0 + dt); o.stop(t0 + dt + 0.18);
  });
}

/* ---------- Wake lock (keeps the screen on while tuning) ---------- */
async function acquireWake() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) { /* not supported or denied: tuner still works */ }
}
function releaseWake() { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.running) {
    acquireWake();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
});

/* ---------- Main detection loop ---------- */
function loop() {
  rafId = requestAnimationFrame(loop);
  const now = performance.now();
  if (now - lastFrameAt < FRAME_MS) return;
  lastFrameAt = now;
  if (state.view !== 'tuner') return;          // settings open: don't analyse or chime
  if (now < pausedUntil) return;               // chime playing: don't listen to ourselves

  analyser.getFloatTimeDomainData(buf);
  const level = rms(buf);
  const thr = (now - lastSignalAt < SILENCE_HOLD_MS) ? MIN_RMS * 0.6 : MIN_RMS;  // lower bar while a note decays
  const got = level >= thr ? yin(buf, audioCtx.sampleRate, det.minHz, det.maxHz, det.preferHz) : null;

  if (got) {
    lastSignalAt = now;
    history.push(got.freq);
    if (history.length > MEDIAN_FRAMES) history.shift();
    const r = evaluate(median(history), det, state.lockedIndex);
    lastReading = r;
    render(r);
    const fire = gate.update(now, Math.round(r.cents), r.key);
    if (fire && !state.muted) {
      playChime();
      pausedUntil = now + CHIME_PAUSE_MS;
      lastSignalAt = pausedUntil;
      history = [];
    }
  } else {
    gate.update(now, null, null);
    if (now - lastSignalAt > SILENCE_HOLD_MS) {
      history = [];
      if (lastReading) { lastReading = null; render(null); }
    }
  }
}

/* ---------- Start / stop ---------- */
async function start() {
  clearMsg();
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showMsg('The microphone needs a secure page. Open this tuner from an https:// address (not a file or plain http link), then tap Start again.');
    return;
  }
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();                          // created inside the tap, as iOS Safari requires
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 },
    });
    source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = FFT_SIZE;
    analyser.smoothingTimeConstant = 0;
    source.connect(analyser);                   // NOT connected to speakers
    buf = new Float32Array(analyser.fftSize);
    stream.getAudioTracks().forEach(t => t.addEventListener('ended', () => {
      if (state.running) { stop(); showMsg('The microphone was disconnected. Reconnect it and tap Start tuning.'); }
    }));
  } catch (err) {
    cleanupAudio();
    const n = err && err.name;
    if (n === 'NotAllowedError' || n === 'SecurityError' || n === 'PermissionDeniedError') {
      showMsg(deniedHelp());
    } else if (n === 'NotFoundError' || n === 'DevicesNotFoundError' || n === 'OverconstrainedError') {
      showMsg('No microphone was found. Plug in or enable a microphone, then tap Start tuning again.');
    } else if (n === 'NotReadableError' || n === 'TrackStartError') {
      showMsg('The microphone is busy. Close other apps or tabs that are using it, then tap Start tuning again.');
    } else {
      showMsg('Could not start the microphone (' + (n || 'unknown error') + '). Reload the page and try again.');
    }
    return;
  }
  state.running = true;
  lastFrameAt = 0; pausedUntil = 0;
  setView('tuner');
  acquireWake();
  rafId = requestAnimationFrame(loop);
}
function cleanupAudio() {
  try { if (stream) stream.getTracks().forEach(t => t.stop()); } catch (e) {}
  try { if (source) source.disconnect(); } catch (e) {}
  try { if (audioCtx && audioCtx.state !== 'closed') audioCtx.close(); } catch (e) {}
  stream = source = analyser = audioCtx = null;
}
function stop() {
  cancelAnimationFrame(rafId);
  state.running = false;
  cleanupAudio();
  releaseWake();
  setView('home');
  resetReading();
}

/* ---------- Wire up ---------- */
// in-tune zone on the gauge, drawn from the single IN_TUNE_CENTS constant
(function drawZone() {
  const a = IN_TUNE_CENTS * DEG_PER_CENT * Math.PI / 180, R = 150, cx = 180, cy = 190;
  const x1 = (cx - R * Math.sin(a)).toFixed(2), x2 = (cx + R * Math.sin(a)).toFixed(2), y = (cy - R * Math.cos(a)).toFixed(2);
  el.zone.setAttribute('d', 'M' + x1 + ' ' + y + ' A' + R + ' ' + R + ' 0 0 1 ' + x2 + ' ' + y);
  el.tolNote.textContent = 'In tune means within ±' + IN_TUNE_CENTS + ' cents.';
})();

// If the microphone was already refused earlier, say so up front instead of after a tap.
try {
  navigator.permissions && navigator.permissions.query({ name: 'microphone' }).then(p => {
    if (p.state === 'denied') showMsg(deniedHelp());
    p.onchange = () => { if (p.state !== 'denied') clearMsg(); };
  }).catch(() => {});
} catch (e) {}
el.start.addEventListener('click', start);
el.stop.addEventListener('click', stop);
el.gear.addEventListener('click', () => setView('settings'));
el.homeSettings.addEventListener('click', () => setView('settings'));
el.settingsBack.addEventListener('click', () => setView(state.prevView));
el.instBtn.addEventListener('click', () => openSheet('inst', el.instBtn));
el.tuningBtn.addEventListener('click', () => openSheet('tuning', el.tuningBtn));
el.sheetCancel.addEventListener('click', closeSheet);
el.sheet.addEventListener('click', e => { if (e.target === el.sheet) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !el.sheet.hidden) closeSheet(); });
el.refDown.addEventListener('click', () => setRef(state.ref - 1));
el.refUp.addEventListener('click', () => setRef(state.ref + 1));
el.chime.addEventListener('click', () => setMuted(!state.muted));
document.querySelectorAll('[data-theme-pick]').forEach(b => b.addEventListener('click', () => applyTheme(b.dataset.themePick)));

applyTheme(state.theme); updateSelectors(); buildStrings(); updateHint(); setMuted(state.muted); setRef(state.ref); render(null);

/* ---------- Offline: the service worker (sw.js) caches every file of the app on first visit ---------- */
if ('serviceWorker' in navigator && window.isSecureContext) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* still works online without it */ });
  });
}
</script>
