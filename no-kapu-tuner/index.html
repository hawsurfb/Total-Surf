<!doctype html>
<html lang="en" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1b1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="No Kapu">
<title>No Kapu Tuner</title>
<link rel="manifest" href="manifest.webmanifest" id="lnkManifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" id="lnkIcon">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" id="lnkApple">
<script>
  /* Apply the saved palette before first paint so Tuna never flashes the default look. */
  try { if (localStorage.getItem('nokapu.theme') === 'tuna') document.documentElement.setAttribute('data-theme', 'tuna'); } catch (e) {}
  window.__nkLinks = function (tuna) {
    var set = function (id, href, type) { var l = document.getElementById(id); if (!l) return; l.setAttribute('href', href); if (type) l.setAttribute('type', type); };
    set('lnkManifest', tuna ? 'manifest-tuna.webmanifest' : 'manifest.webmanifest');
    set('lnkIcon', tuna ? 'icons/tuna/favicon-32.png' : 'icons/icon.svg', tuna ? 'image/png' : 'image/svg+xml');
    set('lnkApple', tuna ? 'icons/tuna/apple-touch-icon.png' : 'icons/apple-touch-icon.png');
  };
</script>
<style>
  :root { color-scheme: dark; }
  /* Default ("Night"): charcoal, soft red when off, mint when in tune. */
  [data-theme="default"] {
    --bg: #1b1b1b; --bg2: #1b1b1b; --panel: #2e2e2e; --line: #3b3b3b;
    --text: #e6e6e6; --dim: #a8a8a8; --idle: #6b6b6b;
    --off: #e8625c; --on: #69cd7f; --accent: #ffb020;
    --leaf-opacity: .07; --leafvein: #1b1b1b;
  }
  /* Tuna: ahi palette. Deep ocean, coral flesh, limu seafoam, yellowfin gold. */
  [data-theme="tuna"] {
    --bg: #0a2230; --bg2: #0d2b3d; --panel: #123246; --line: #21495f;
    --text: #eef3f2; --dim: #93b2bf; --idle: #5d8294;
    --off: #ff6b61; --on: #6fe0bd; --accent: #f2c14e;
    --leaf-opacity: .09; --leafvein: #0a2230;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body {
    height: 100%; margin: 0; overscroll-behavior: none;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  body { overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  .app { position: fixed; inset: 0; background: linear-gradient(180deg, var(--bg), var(--bg2)); --state: var(--idle); }
  .app[data-state="off"] { --state: var(--off); }
  .app[data-state="on"] { --state: var(--on); }
  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden;
    padding: max(14px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
             max(18px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ================= opening screen ================= */
  #start { align-items: center; justify-content: center; cursor: pointer; }
  .art { position: absolute; inset: 0; pointer-events: none; background-size: cover; background-position: center; }
  .leaf { position: absolute; color: var(--text); opacity: var(--leaf-opacity); }
  .leaf-a { width: 300px; height: 300px; right: -90px; top: -60px; transform: rotate(25deg); }
  .leaf-b { width: 340px; height: 340px; left: -130px; bottom: -90px; transform: rotate(-155deg); }
  .brand-default, .brand-tuna { position: relative; display: flex; flex-direction: column; align-items: center; }
  .brand-default { width: min(80vw, 440px); }
  .brand-default img { width: 100%; height: auto; display: block; }
  .brand-tuna { display: none; width: min(80vw, 440px); gap: 4vh; }
  .brand-tuna .fish { width: 86%; align-self: flex-end; margin-right: 2%; height: auto; display: block; }
  .brand-tuna .wm { width: 100%; height: auto; display: block; }
  [data-theme="tuna"] .brand-default, [data-theme="tuna"] .leaf { display: none; }
  [data-theme="tuna"] .brand-tuna { display: flex; }
  [data-theme="tuna"] #start .art { background-image: url(img/tuna-opening-bg.webp); }
  .msg {
    position: absolute; left: 24px; right: 24px; bottom: max(36px, env(safe-area-inset-bottom)); margin: 0;
    text-align: center; color: var(--dim); font-size: 14px; line-height: 1.45; min-height: 1.4em;
  }

  /* ================= tuner screen ================= */
  #tuner .art { display: none; }
  [data-theme="tuna"] #tuner .art { display: block; background-image: url(img/tuna-tuner-bg.webp); }
  #tuner > *:not(.art) { position: relative; }

  .bar { display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
  .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--dim); }
  .icon-btn:active { color: var(--text); }

  /* flick-to-pick instrument */
  .modepick {
    width: min(270px, 70vw); overflow-x: auto; overflow-y: hidden; display: flex;
    padding: 0 calc(50% - 62px); scroll-snap-type: x mandatory; scrollbar-width: none;
    -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
  }
  .modepick::-webkit-scrollbar { display: none; }
  .modepick button {
    flex: 0 0 124px; scroll-snap-align: center; min-height: 44px; font-size: 21px; letter-spacing: .01em; font-weight: 500;
    color: var(--accent); opacity: 0; pointer-events: none; transition: opacity .5s ease; white-space: nowrap;
  }
  .modepick button[aria-checked="true"] { opacity: 1; pointer-events: auto; }
  .modepick.dragging button { opacity: .38; pointer-events: auto; color: var(--text); transition-duration: .15s; }
  .modepick.dragging button[aria-checked="true"] { opacity: 1; color: var(--accent); }

  /* flat | frequency | sharp on one line */
  .fsrow { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 4px; min-height: 52px; }
  .acc-ind { font-size: 40px; line-height: 1; color: var(--idle); opacity: .45; transition: color .15s, opacity .15s; padding: 2px 4px; }
  .acc-ind.flat { justify-self: start; }
  .acc-ind.sharp { justify-self: end; }
  .acc-ind.lit { color: var(--state); opacity: 1; }
  .hz { font-size: 19px; letter-spacing: .02em; font-variant-numeric: tabular-nums; color: var(--dim); text-align: center; min-width: 8ch; }
  .hz.ghost { color: var(--idle); opacity: .7; }

.resume-hint { margin: 0; text-align: center; font-size: 14px; color: var(--accent); }
  .readout { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; position: relative; }
  .note-wrap { display: flex; justify-content: center; align-items: baseline; }
  .note {
    font-weight: 300; font-size: clamp(130px, 46vw, 250px); line-height: 1; letter-spacing: -.02em; white-space: nowrap;
    color: var(--state); transition: color .12s linear; font-variant-numeric: tabular-nums;
  }
  .note .acc { font-size: .38em; vertical-align: top; position: relative; top: .12em; margin-left: .02em; }
  .note .oct { font-size: .2em; margin-left: .1em; letter-spacing: 0; color: var(--dim); }
  .app[data-state="idle"] .note { color: var(--idle); opacity: .5; }
  .centsbox { position: absolute; left: 2px; bottom: 6px; display: flex; flex-direction: column; gap: 0; }
  .centsbox .lab { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
  .centsbox .val { font-size: 34px; font-variant-numeric: tabular-nums; color: var(--state); line-height: 1.1; min-width: 3ch; }
  .app[data-state="idle"] .centsbox .val { color: var(--idle); opacity: .6; }

  .meter { width: 100%; max-width: 440px; margin: 6px auto 0; padding: 0 4px; }
  .scale { position: relative; height: 96px; }
  .tick { position: absolute; bottom: 0; width: 2px; height: 26px; margin-left: -1px; border-radius: 1px; background: var(--line); }
  .tick.major { height: 44px; background: var(--dim); opacity: .55; }
  .tick.mid { height: 70px; background: var(--dim); opacity: 1; }
  .needle {
    position: absolute; bottom: 0; left: 50%; width: 4px; height: 94px; margin-left: -2px; border-radius: 2px;
    background: var(--state); transition: left .12s linear, background .2s, opacity .2s;
  }
  .app[data-state="idle"] .needle { opacity: .3; }

  /* bottom notes */
  .bottom { margin: 18px -20px 0; min-height: 148px; display: flex; align-items: flex-end; }
  .ruler {
    width: 100%; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; position: relative;
    -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 16%, #000 84%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 16%, #000 84%, transparent);
  }
  .ruler::-webkit-scrollbar { display: none; }
  .rtrack { display: flex; padding: 0 calc(50% - 28px); width: max-content; min-width: 100%; }
  .rn {
    flex: 0 0 56px; height: 130px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px;
    color: var(--dim); transition: opacity 1.1s ease, color .15s; font-variant-numeric: tabular-nums;
  }
  .rn .l { font-size: 22px; line-height: 1; white-space: nowrap; }
  .rn .l small { font-size: 12px; opacity: .7; margin-left: 1px; }
  .rn .tk { display: block; width: 2px; height: 36px; border-radius: 1px; background: currentColor; opacity: .35; }
  .rn.c .tk { height: 56px; opacity: .6; }
  .rn.cur { color: var(--state); }
  .app[data-state="idle"] .rn.cur { color: var(--accent); }
  .rn.cur .l { font-size: 30px; }
  .rn.cur .tk { opacity: 1; width: 3px; }
  .ruler.solo .rn:not(.cur) { opacity: 0; }
  .ruler.gone .rn { opacity: 0; }

  .strings { width: 100%; display: flex; justify-content: space-around; align-items: flex-end; padding: 0 16px; }
  .gs { flex: 1; max-width: 70px; display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 44px; color: var(--dim); position: relative; }
  .gs .l { font-size: 18px; line-height: 1; }
  .gs .l small { font-size: 11px; opacity: .7; margin-left: 1px; }
  .gs .ln { display: block; width: 2px; height: 118px; border-radius: 1px; background: var(--line); transition: background .15s, width .15s; }
  .gs.active { color: var(--state); }
  .gs.active .ln { background: var(--state); width: 3px; }
  .gs[aria-pressed="true"]::after { content: ""; position: absolute; bottom: -10px; width: 4px; height: 4px; border-radius: 50%; background: var(--text); }

  /* ================= settings ================= */
  #settings { overflow-y: auto; }
  .set-head { display: flex; align-items: center; gap: 4px; min-height: 52px; margin-bottom: 8px; }
  .set-head h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .group { margin-top: 20px; }
  .group > h3 { margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; font-size: 17px; }
  .seg { display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--panel); }
  .seg button { min-height: 44px; padding: 6px 14px; border-radius: 9px; color: var(--dim); font-size: 15px; }
  .seg button[aria-pressed="true"] { background: var(--line); color: var(--text); }
  .palettes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pal { padding: 12px; border-radius: 14px; border: 2px solid var(--line); text-align: left; display: flex; flex-direction: column; gap: 10px; }
  .pal[aria-pressed="true"] { border-color: var(--accent); }
  .pal .sw { display: flex; gap: 6px; }
  .pal .sw i { width: 22px; height: 22px; border-radius: 50%; display: block; border: 1px solid rgba(255,255,255,.12); }
  .pal span { font-size: 16px; }
  .stepper { display: flex; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; }
  .stepper button { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); font-size: 22px; line-height: 1; }
  .opts { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px; text-align: left; border-bottom: 1px solid var(--line); font-size: 17px; }
  .opt small { color: var(--dim); font-size: 13px; letter-spacing: .04em; }
  .opt .chk { width: 20px; height: 20px; color: var(--accent); opacity: 0; }
  .opt[aria-checked="true"] .chk { opacity: 1; }
  .switch { position: relative; width: 56px; height: 32px; border-radius: 16px; background: var(--line); transition: background .15s; flex: none; }
  .switch::before { content: ""; position: absolute; inset: -6px -4px; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--text); transition: transform .15s; }
  .switch[aria-checked="true"] { background: var(--on); }
  .switch[aria-checked="true"]::after { transform: translateX(24px); background: #fff; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<!-- Monstera leaf artwork for the Default palette (opening screen). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="monstera" viewBox="0 0 200 200">
      <path d="M100 8 C136 10 166 28 180 52 L142 60 L190 74 C196 92 196 108 190 124 L146 116 L184 138 C176 160 150 178 118 184 L100 160 L82 184 C50 178 24 160 16 138 L54 116 L10 124 C4 108 4 92 10 74 L58 60 L20 52 C34 28 64 10 100 8 Z" fill="currentColor"/>
      <path d="M100 160 V26 M100 122 L62 100 M100 122 L138 100 M100 86 L68 68 M100 86 L132 68" fill="none" stroke="var(--leafvein)" stroke-width="3" stroke-linecap="round"/>
      <path d="M100 160 Q104 182 96 198" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<div class="app" id="app" data-state="idle">

  <!-- ===== opening screen: tap anywhere ===== -->
  <main id="start" class="screen" role="button" tabindex="0" aria-label="No Kapu Tuner. Tap anywhere to start.">
    <div class="art" aria-hidden="true">
      <svg class="leaf leaf-a" viewBox="0 0 200 200"><use href="#monstera" width="200" height="200"/></svg>
      <svg class="leaf leaf-b" viewBox="0 0 200 200"><use href="#monstera" width="200" height="200"/></svg>
    </div>
    <div class="brand-default" aria-hidden="true">
      <img src="img/nokapu-tuner-wordmark.svg" alt="" draggable="false">
    </div>
    <div class="brand-tuna" aria-hidden="true">
      <img class="fish" src="img/tuna-fish.webp" alt="" draggable="false">
      <img class="wm" src="img/wordmark-tuna.svg" alt="" draggable="false">
    </div>
    <p id="startMsg" class="msg" role="status"></p>
  </main>

  <!-- ===== tuner ===== -->
  <main id="tuner" class="screen" hidden>
    <div class="art" aria-hidden="true"></div>
    <header class="bar">
      <div class="modepick" id="modes" role="radiogroup" aria-label="Instrument" tabindex="0">
        <button type="button" role="radio" data-mode="guitar" aria-checked="false">Guitar</button>
        <button type="button" role="radio" data-mode="ukulele" aria-checked="false">Ukulele</button>
        <button type="button" role="radio" data-mode="chromatic" aria-checked="false">Chromatic</button>
      </div>
      <button id="openSettings" class="icon-btn" type="button" aria-label="Settings">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <p id="resumeHint" class="resume-hint" role="status" hidden>Audio paused. Tap anywhere to resume.</p>
    <div class="fsrow" aria-hidden="true">
      <span id="flatInd" class="acc-ind flat">♭</span>
      <span id="hzTxt" class="hz ghost">000.0 Hz</span>
      <span id="sharpInd" class="acc-ind sharp">♯</span>
    </div>

    <section class="readout" aria-hidden="true">
      <div class="note-wrap"><div id="note" class="note">C<span class="oct">4</span></div></div>
      <div class="centsbox"><span class="lab">Cent</span><span id="centsTxt" class="val">0</span></div>
    </section>

    <section class="meter" aria-hidden="true">
      <div class="scale" id="scale"><div class="needle" id="needle"></div></div>
    </section>

    <section class="bottom">
      <div id="ruler" class="ruler" aria-label="Notes. Swipe to browse."><div id="rtrack" class="rtrack"></div></div>
      <nav id="strings" class="strings" aria-label="Strings" hidden></nav>
    </section>
    <div id="status" class="sr" role="status" aria-live="polite"></div>
  </main>

  <!-- ===== settings ===== -->
  <main id="settings" class="screen" hidden>
    <header class="set-head">
      <button id="closeSettings" class="icon-btn" type="button" aria-label="Back">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2>Settings</h2>
    </header>

    <section class="group">
      <h3>Palette</h3>
      <div class="palettes" id="palettes" role="group" aria-label="Palette">
        <button type="button" class="pal" data-theme-choice="default" aria-pressed="false">
          <span class="sw"><i style="background:#1b1b1b"></i><i style="background:#e8625c"></i><i style="background:#69cd7f"></i><i style="background:#ffb020"></i></span><span>Default</span>
        </button>
        <button type="button" class="pal" data-theme-choice="tuna" aria-pressed="false">
          <span class="sw"><i style="background:#0a2230"></i><i style="background:#ff6b61"></i><i style="background:#6fe0bd"></i><i style="background:#f2c14e"></i></span><span>Tuna</span>
        </button>
      </div>
    </section>

    <section class="group">
      <h3>Tuning</h3>
      <div class="row">
        <span>Reference pitch</span>
        <div class="stepper">
          <button id="a4Down" type="button" aria-label="Lower reference pitch">−</button>
          <span id="a4Val">A = 440 Hz</span>
          <button id="a4Up" type="button" aria-label="Raise reference pitch">+</button>
        </div>
      </div>
      <div class="row">
        <span>Black keys</span>
        <div class="seg" id="spelling" role="group" aria-label="Black key spelling">
          <button type="button" data-spell="sharp" aria-pressed="false">C♯</button>
          <button type="button" data-spell="flat" aria-pressed="false">D♭</button>
        </div>
      </div>
    </section>

    <section class="group">
      <h3>Guitar tuning</h3>
      <div class="opts" id="tunings" role="radiogroup" aria-label="Guitar tuning"></div>
    </section>

    <section class="group">
      <h3>Sound</h3>
      <div class="row">
        <span>Chime when in tune</span>
        <button id="chimeSwitch" class="switch" type="button" role="switch" aria-checked="true" aria-label="Chime when in tune"></button>
      </div>
    </section>
  </main>
</div>

<script src="tuner-core.js"></script>
<script>
(function () {
  'use strict';

  var C = window.TunerCore;
  var $ = function (id) { return document.getElementById(id); };
  var qsa = function (sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); };

  var A4_MIN = 415, A4_MAX = 466;
  var FRAME_MS = 40;            // pitch detection ~25x per second
  var IDLE_AFTER_MS = 2500;     // keep the last reading this long after the sound stops
  var SOLO_AFTER_MS = 1000;     // chromatic ruler: other notes fade after this much silence
  var GONE_AFTER_MS = 7000;     // ...and the last note fades after this
  var USER_HOLD_MS = 2500;      // pause ruler auto-follow after the user touches it
  var IN_TUNE_CENTS = 5;
  var IN_TUNE_FRAMES = 5;
  var RN_W = 56;                // width of one note on the ruler
  var MIDI_LO = 12, MIDI_HI = 119; // C0 .. B8
  var MODE_W = 124;

  function store(key, value) {
    try {
      if (value === undefined) return localStorage.getItem('nokapu.' + key);
      localStorage.setItem('nokapu.' + key, String(value));
    } catch (e) { /* storage unavailable: settings just won't persist */ }
    return null;

  var wake = null;
  function requestWake() {
    try {
      if (!('wakeLock' in navigator) || wake) return;
      navigator.wakeLock.request('screen').then(function (lock) {
        wake = lock;
        lock.addEventListener('release', function () { if (wake === lock) wake = null; });
      }).catch(function () {});
    } catch (e) { /* not supported */ }
  }
  function releaseWake() { if (wake) { wake.release().catch(function () {}); wake = null; } }

  /* ---------- screens ---------- */
  function show(name) {
    $('start').hidden = name !== 'start';
    $('tuner').hidden = name !== 'tuner';
    $('settings').hidden = name !== 'settings';
    if (name === 'tuner') { scrollModes(state.mode, false); markRulerCurrent(); }
  }

  var starting = false;
  function begin() {
    if (starting) return;
    starting = true;
    $('startMsg').textContent = '';
    var p; try { p = startAudio(); } catch (e) { p = Promise.reject(e); }
    p.then(function () {
      show('tuner');
      lastHeard = performance.now();
      setMode(state.mode, false);
      scrollModes(state.mode, false);
      requestWake();
      startLoop();
      cancelAnimationFrame(uiRaf); uiRaf = 0; uiLoop();
    }).catch(function (err) {
      if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
      if (ctx && ctx.close) ctx.close().catch(function () {});
      ctx = null;
      $('startMsg').textContent = friendlyError(err);
    }).then(function () { starting = false; });
  }
  $('start').addEventListener('click', begin);
  $('start').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); begin(); } });

  /* ---------- wiring ---------- */
  qsa('#palettes button').forEach(function (b) {
    b.addEventListener('click', function () { chooseTheme(b.getAttribute('data-theme-choice')); });
  });
  qsa('#spelling button').forEach(function (b) {
    b.addEventListener('click', function () {
      state.flats = b.getAttribute('data-spell') === 'flat';
      store('flats', state.flats ? '1' : '0');
      paintSpelling(); labelRuler(); renderStrings();
      if (showing) { /* next frame repaints the note */ } else paintGhost();
    });
  });
  $('chimeSwitch').addEventListener('click', function () {
    state.chime = !state.chime; store('chime', state.chime ? '1' : '0'); paintChime();
    if (state.chime) { chimeArmed = false; playChime(); }
  });
  function changeA4(d) {
    var next = Math.max(A4_MIN, Math.min(A4_MAX, state.a4 + d));
    if (next === state.a4) return;
    state.a4 = next; store('a4', next); resetReadings(); paintA4();
  }
  $('a4Down').addEventListener('click', function () { changeA4(-1); });
  $('a4Up').addEventListener('click', function () { changeA4(1); });
  $('openSettings').addEventListener('click', function () { show('settings'); $('closeSettings').focus(); });
  $('closeSettings').addEventListener('click', function () { show('tuner'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('settings').hidden) show('tuner'); });

  document.addEventListener('visibilitychange', function () {
    if (!ctx) return;
    if (document.hidden) {
      stopLoop(); releaseWake();
      if (stream) stream.getAudioTracks().forEach(function (t) { t.enabled = false; });   // mic indicator off while away
      ctx.suspend().catch(function () {});
    } else {
      if (stream) stream.getAudioTracks().forEach(function (t) { t.enabled = true; });
      ctx.resume().catch(function () {}).then(function () { lastHeard = performance.now(); startLoop(); requestWake(); paintResume(); });
    }
  });
  document.addEventListener('pointerdown', function () {
    if (ctx && ctx.state !== 'running' && ctx.state !== 'closed' && !document.hidden) ctx.resume().catch(function () {});
  });

  /* ---------- init ---------- */
  buildRuler();
  buildTunings();
  applyTheme(state.theme);
  paintSpelling(); paintChime(); paintA4(); paintModes();
  renderStrings();
  setRulerMidi(60, true);
  paintGhost();

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
